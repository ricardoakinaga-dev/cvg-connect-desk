name: Staging Integrations (MinIO + ClamAV + OTel Collector real)

# §6–9: evidência REAL para integrações externas (não mocks).
# Roda no push main + manual; MinIO, ClamAV e Collector sobem como services.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  staging-integrations:
    name: Real MinIO + ClamAV + Collector smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://connect_desk:root@localhost:5432/connect_desk_db
      STAGING_SMOKE: "1"
      S3_ENDPOINT: http://127.0.0.1:9100
      S3_BUCKET: cvg-media-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: "3310"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318/v1/traces

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: connect_desk
          POSTGRES_PASSWORD: root
          POSTGRES_DB: connect_desk_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connect_desk -d connect_desk_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Start MinIO, ClamAV and OTel Collector
        shell: bash
        run: |
          docker run -d --name cvg-minio \
            -p 9100:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ":9001"
          docker run -d --name cvg-clamav \
            -p 3310:3310 \
            clamav/clamav:stable
          docker run -d --name cvg-otel-collector \
            -p 4318:4318 \
            -v "$GITHUB_WORKSPACE/infra/otel/otelcol-config.yaml:/etc/otelcol/otelcol-config.yaml:ro" \
            otel/opentelemetry-collector-contrib:latest \
            --config=/etc/otelcol/otelcol-config.yaml

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9100/minio/health/live >/dev/null; then break; fi
            if (( attempt == 60 )); then docker logs cvg-minio; exit 1; fi
            sleep 2
          done

          for attempt in {1..90}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/3310' 2>/dev/null; then break; fi
            if (( attempt == 90 )); then docker logs cvg-clamav; exit 1; fi
            sleep 2
          done

          for attempt in {1..30}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/4318' 2>/dev/null; then break; fi
            if (( attempt == 30 )); then docker logs cvg-otel-collector; exit 1; fi
            sleep 2
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cvg/database db:migrate
      - name: Real MinIO + Real ClamAV integration tests
        run: pnpm --filter @cvg/media exec vitest run src/__tests__/minio-real.test.ts src/__tests__/clamav-real.test.ts
      - name: Staging smoke (MinIO put/get/signed + ClamAV clean/EICAR + Collector reachable)
        run: node scripts/staging-smoke.mjs
      - name: OTel Collector end-to-end spans
        run: node scripts/otel-e2e-check.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-integrations
          path: artifacts/staging-*.json
