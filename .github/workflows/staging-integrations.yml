name: Staging Integrations (MinIO + ClamAV + OTel Collector real)

# §6–9: evidência REAL para integrações externas (não mocks).
# Roda no push main + manual; MinIO, ClamAV e Collector sobem como services.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  staging-integrations:
    name: Real MinIO + ClamAV + Collector smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://connect_desk:root@localhost:5432/connect_desk_db
      STAGING_SMOKE: "1"
      S3_ENDPOINT: http://127.0.0.1:9100
      S3_BUCKET: cvg-media-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: "3310"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318/v1/traces

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: connect_desk
          POSTGRES_PASSWORD: root
          POSTGRES_DB: connect_desk_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connect_desk -d connect_desk_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9100:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
        options: >-
          --health-cmd "nc -z 127.0.0.1 3310 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      otel-collector:
        image: otel/opentelemetry-collector-contrib:latest
        command: ["--config=/etc/otelcol/otelcol-config.yaml"]
        volumes:
          - ./infra/otel/otelcol-config.yaml:/etc/otelcol/otelcol-config.yaml:ro
        ports:
          - 4318:4318
        options: >-
          --health-cmd "wget -qO- http://localhost:13133/ || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cvg/database db:migrate
      - name: Real MinIO + Real ClamAV integration tests
        run: pnpm --filter @cvg/media exec vitest run src/__tests__/minio-real.test.ts src/__tests__/clamav-real.test.ts
      - name: Staging smoke (MinIO put/get/signed + ClamAV clean/EICAR + Collector reachable)
        run: node scripts/staging-smoke.mjs
      - name: OTel Collector end-to-end spans
        run: node scripts/otel-e2e-check.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-integrations
          path: artifacts/staging-*.json
