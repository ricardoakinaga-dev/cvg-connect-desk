name: DR End-to-End (backup/restore proof)

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  dr-e2e:
    name: Backup, destroy, restore, validate, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DR_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: DR end-to-end (fails CI on restore failure)
        run: bash infra/scripts/dr-e2e.sh
      - name: Upload DR evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dr-e2e-logs
          path: /tmp/dr-e2e-app.log
