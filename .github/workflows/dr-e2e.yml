name: DR End-to-End (backup/restore proof)

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  dr-e2e:
    name: Backup, destroy, restore, validate, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DR_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: DR end-to-end (fails CI on restore failure)
        run: bash infra/scripts/dr-e2e.sh
      - name: Upload DR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-e2e-logs
          path: /tmp/dr-e2e-app.log
