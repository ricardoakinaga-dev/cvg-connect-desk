name: Triple AAA Gate

on:
  push:
    branches:
      - main
  pull_request:

# Estados formais de promoção (§23):
# FAILED — qualquer gate crítico vermelho
# CONDITIONAL — gates críticos verdes, evidência externa pendente
# VERIFIED_CANDIDATE — tudo verde incluindo evidência externa
# TRIPLE_AAA_CERTIFIED — tag manual após aprovação (nunca automática)

jobs:
  critical-gates:
    name: Critical gates (unit, integration, migrations, build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: connect_desk
          POSTGRES_PASSWORD: root
          POSTGRES_DB: connect_desk_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connect_desk -d connect_desk_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://connect_desk:root@localhost:5432/connect_desk_db
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint (0 errors)
        run: pnpm --filter @cvg/desk-web exec eslint . --max-warnings 100
      - name: Typecheck
        run: pnpm --filter @cvg/desk-web exec tsc --noEmit -p tsconfig.json
      - name: Unit + integration (turbo)
        run: pnpm exec turbo run test --force
      - name: Postgres real chain
        run: pnpm test:postgres-real
      - name: Migration fresh-DB check
        run: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres pnpm --filter @cvg/database db:check
        env:
          DATABASE_URL: postgresql://connect_desk:root@localhost:5432/connect_desk_db
      - name: Build
        run: pnpm --filter @cvg/desk-web build

  security-gate:
    name: Security gate (audit critical + secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: critical-gates
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (critical blocks merge)
        run: pnpm audit --audit-level=critical
      - name: Gitleaks (secret leak blocks merge)
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3

  promotion-state:
    name: Promotion state
    runs-on: ubuntu-latest
    needs: [critical-gates, security-gate]
    if: always()
    steps:
      - name: Compute state
        run: |
          if [ "${{ needs.critical-gates.result }}" != "success" ] || [ "${{ needs.security-gate.result }}" != "success" ]; then
            echo "STATE=FAILED" >> "$GITHUB_ENV"
            echo "Promotion state: FAILED"
            exit 1
          fi
          echo "STATE=CONDITIONAL" >> "$GITHUB_ENV"
          echo "Promotion state: CONDITIONAL (critical gates green; external evidence: CodeQL/Trivy/SBOM/E2E/DR per workflows)"
