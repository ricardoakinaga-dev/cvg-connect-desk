global:
  scrape_interval: 15s
scrape_configs:
  - job_name: desk-api
    static_configs:
      - targets: ["desk-api:3000"]
    # C08/AAA-18: /metrics exige METRICS_TOKEN em produção. O arquivo de
    # credenciais é materializado no container (tmpfs), nunca versionado.
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
  - job_name: realtime
    static_configs:
      - targets: ["realtime-service:8080"]
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
  - job_name: message-worker
    static_configs:
      - targets: ["message-worker:9090"]
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
